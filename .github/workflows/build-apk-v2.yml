name: Build Offline Android APK v2 (DeepGaitV2)

on:
  push:
    branches: [ main ]
    paths:
      - 'MetodoAlternativo/android_app_v2/**'
      - '.github/workflows/build-apk-v2.yml'
  workflow_dispatch:

jobs:
  build-apk-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK v2
        working-directory: MetodoAlternativo/android_app_v2
        run: gradle assembleDebug --no-daemon

      - name: Upload APK v2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GaitRecognition-V2-DeepGaitV2-Offline-APK
          path: MetodoAlternativo/android_app_v2/app/build/outputs/apk/debug/app-debug.apk
