# Configuración centralizada para Método Alternativo (v2)
paths:
  project_root: "c:/Users/angel.roman/Downloads/ProyectoIA"
  manifest: "c:/Users/angel.roman/Downloads/ProyectoIA/configs/dataset_manifest.json"
  features_root: "c:/Users/angel.roman/Downloads/ProyectoIA/outputs/features"
  trimmed_root: "c:/Users/angel.roman/Downloads/ProyectoIA/dataset_trimmed"
  plan1_gallery_pkl: "c:/Users/angel.roman/Downloads/ProyectoIA/outputs/gallery_db.pkl"
  plan1_weights: "c:/Users/angel.roman/Downloads/ProyectoIA/weights/GaitBase_DA-180000.pt"
  v2_root: "c:/Users/angel.roman/Downloads/ProyectoIA/MetodoAlternativo"
  v2_weights: "c:/Users/angel.roman/Downloads/ProyectoIA/MetodoAlternativo/weights"
  v2_outputs: "c:/Users/angel.roman/Downloads/ProyectoIA/MetodoAlternativo/outputs"

heatmap:
  img_h: 64
  img_w: 44
  sigma: 1.5
  min_conf: 0.20

quality_gate:
  min_sil_area_ratio: 0.04
  max_sil_area_ratio: 0.65
  min_leg_conf: 0.25
  border_margin_px: 3
  min_valid_frames: 10

matching:
  top_k_parts: 10          # Se evalúa ablación [8, 10, 12, 16] en benchmark_ab.py
  top_k_gallery: 3         # Promedio de las Top-K secuencias más afines por sujeto
  use_tta_flip: true       # Test-Time Horizontal Flip
  use_as_norm: true        # Adaptive Score Normalization (impostor cohort)
  as_norm_cohort_size: 20  # Top impostores para media/std en AS-Norm
  min_score: 0.50
  min_margin: 0.02

realtime:
  window_frames: 60
  eval_interval: 15
  seg_imgsz: 512
  pose_roi_imgsz: 256
  roi_pad_ratio: 0.18
